<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#101820" />
  <meta name="description" content="مدينة المادة - عالم مفتوح ثلاثي الأبعاد للهاتف" />
  <title>مدينة المادة | عالم مفتوح</title>
</head>
<body>
  <div id="app">
    <div id="game"></div>
    <header class="topbar">
      <div class="brand"><span class="brand-mark">م</span><div><strong>مدينة المدى</strong><small>عالم مفتوح</small></div></div>
      <div class="hud"><span> $ <b id="money">2,500</b></span><span>❤ <b id="health">100</b></span></div>
    </header>
    <div class="mission"><small>المهمة الحالية</small><strong>استكشف المدينة</strong><span>تعرّف على شوارع المدينة ومرافقها</span></div>
    <div class="location" id="location">وسط المدينة</div>
    <div class="controls">
      <div class="stick-area" id="stickArea"><div class="stick" id="stick"></div></div>
      <div class="action-buttons"><button id="enterBtn" aria-label="دخول المركبة">🚗</button><button id="runBtn" aria-label="ركض">🏃</button></div>
    </div>
    <div class="hint" id="hint">حرّك عصا التحكم للمشي واستكشف المدينة</div>
    <div class="loading" id="loading"><div class="loader"></div><strong>جاري بناء المدينة...</strong><small>تهيئة العالم ثلاثي الأبعاد</small></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
