<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#101820" />
  <meta name="description" content="وتين ستي: عالم مفتوح ثلاثي الأبعاد للهاتف، باللغة العربية" />
  <title>وتين ستي | عالم مفتوح عربي</title>
</head>
<body>
  <div id="app">
    <div id="game"></div>
    <header class="topbar">
      <div class="brand"><span class="brand-mark">و</span><div><strong>وتين ستي</strong><small>عالم مفتوح عربي</small></div></div>
      <div class="hud"><span>الرصيد: <b id="money">٢٬٥٠٠</b></span><span>الصحة: <b id="health">١٠٠</b> ❤</span></div>
    </header>
    <div class="mission"><small>مهمتك الحالية</small><strong>اكتشف وتين ستي</strong><span>ابدأ جولتك وتعرّف على أحياء المدينة</span></div>
    <div class="location" id="location">وسط المدينة</div>
    <div class="controls">
      <div class="stick-area" id="stickArea"><div class="stick" id="stick"></div></div>
      <div class="action-buttons"><button id="enterBtn" aria-label="دخول المركبة">🚗</button><button id="runBtn" aria-label="ركض">🏃</button></div>
    </div>
    <div class="hint" id="hint">استخدم عصا التحكم للحركة واستكشف وتين ستي</div>
    <div class="loading" id="loading"><div class="loader"></div><strong>جاري بناء المدينة...</strong><small>تهيئة العالم ثلاثي الأبعاد</small></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
